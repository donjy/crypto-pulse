function macroImpact(m) {
  const a = num(m.actual), f = num(m.forecast), p = num(m.prev);
  if (m.type === 'inflation') {
    if (a == null || f == null) return { tag:'中性', why:'数据未公布或缺少预期值' };

    if (a < f) return { tag:'利多', why:`就业 ${m.actual} 弱于预期 ${m.forecast} → 降息/少加息预期 → 利多` };
    return { tag:'中性', why:'符合预期' };
  }
  if (m.type === 'fed') {
    const act = m.fedAction, exp = m.fedExpected;
    if (act === 'cut') return { tag:'利多', why:'降息 → 流动性宽松 → 利多' };
    if (act === 'hike') return { tag:'利空', why:'加息 → 流动性收紧 → 利空' };
    return { tag:'中性', why:`维持利率${exp === 'hold' ? '，符合市场预期' : ''} → 中性（注意：${m.note || ''}）` };

  if (m.type === 'dxy') {
    if (a == null || p == null) return { tag:'中性', why:'缺少数据' };

  }

}

// 简单限速队列
function makeQueue(concurrency, gapMs) {
  let active = 0; const q = [];
  const pump = () => {
    while (active < concurrency && q.length) {
      const { fn, res, rej } = q.shift(); active++;
      fn().then(res, rej).finally(async () => { await sleep(gapMs); active--; pump(); });
    }
  };
  return fn => new Promise((res, rej) => { q.push({ fn, res, rej }); pump(); });
}
const CACHE = new Map(); const TTL = 60000;
async function cached(key, fn, ttl = TTL) {
  const c = CACHE.get(key); if (c && Date.now() - c.t < ttl) return c.v;
  const v = await fn(); CACHE.set(key, { t: Date.now(), v }); return v;
}

/* ============================================================
 * WebSocket 管理：自动重连（指数退避）
 * ============================================================ */
class WSConn {
  constructor(name, url, { onOpen, onMessage, onStatus, pingMs }) {
    Object.assign(this, { name, url, onOpen, onMessage, onStatus, pingMs, retry:0, closed:false });
    this.connect();
  }
  connect() {
    if (this.closed) return;
    this.onStatus(this.name, 'connecting');
    let ws; try { ws = new WebSocket(this.url); } catch (e) { return this.schedule(); }
    this.ws = ws;
    ws.onopen = () => { this.retry = 0; this.onStatus(this.name, 'open'); this.onOpen && this.onOpen(ws);
      if (this.pingMs) this.pinger = setInterval(() => ws.readyState === 1 && ws.send('ping'), this.pingMs); };
    ws.onmessage = e => { if (e.data === 'pong') return; try { this.onMessage(JSON.parse(e.data)); } catch {} };
    ws.onclose = () => { clearInterval(this.pinger); if (!this.closed) { this.onStatus(this.name, 'reconnecting'); this.schedule(); } };
    ws.onerror = () => { try { ws.close(); } catch {} };
  }
  schedule() { const d = Math.min(30000, 1000 * 2 ** this.retry++); this.nextRetry = Date.now() + d; this.timer = setTimeout(() => this.connect(), d); }
  close() { this.closed = true; clearTimeout(this.timer); clearInterval(this.pinger); try { this.ws && this.ws.close(); } catch {} }
}

function fmtPrice(n) {
  if (n == null || !isFinite(n)) return '—';
  if (n >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
  if (n >= 1) return n.toLocaleString('en-US', { maximumFractionDigits:4 });
  if (n >= 0.001) return n.toFixed(6);
  return n.toPrecision(4);
}
const fmtVol = v => v == null ? '—' : v >= 1e9 ? (v/1e9).toFixed(2)+'B' : v >= 1e6 ? (v/1e6).toFixed(2)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'K' : v.toFixed(0);
const fmtPct = (p, d = 2) => p == null || !isFinite(p) ? '—' : (p > 0 ? '+' : '') + p.toFixed(d) + '%';
const fmtFund = f => f == null || !isFinite(f) ? '—' : (f * 100).toFixed(4) + '%';

function Pct({ v, up, down, className = '' }) {
  if (v == null || !isFinite(v)) return <span className="text-muted">—</span>;
  return <span className={`font-mono tabular ${className}`} style={{ color: v >= 0 ? up : down }}>{fmtPct(v)}</span>;
}
function Sparkline({ data, up, down, w = 84, h = 26 }) {
  if (!data || data.length < 2) return <span className="text-[10px] text-muted">…</span>;
  const mn = Math.min(...data), mx = Math.max(...data), r = mx - mn || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * w},${h - ((v - mn) / r) * (h - 2) - 1}`).join(' ');
  return <svg width={w} height={h}><polyline fill="none" stroke={data.at(-1) >= data[0] ? up : down} strokeWidth="1.4" points={pts} /></svg>;
}
function Section({ title, right, children }) {
  return <div className="mb-4"><div className="flex items-center justify-between mb-2"><h3 className="text-xs font-semibold text-white/90">{title}</h3><div className="flex gap-1">{right}</div></div>{children}</div>;
}
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .18].forEach(d => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15, a.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d + .15); o.start(a.currentTime + d); o.stop(a.currentTime + d + .16); }); } catch {}
}

/* ============================================================
 * 关键价位：成交量分布阶梯图
 * ============================================================ */
const LEVEL_TFS = [['5m','m5'],['15m','m15'],['1h','h1'],['4h','h4'],['1d','d1']];
const SUP_COL = '#22D3EE', RES_COL = '#F59E0B', BUY_COL = '#26A69A', SELL_COL = '#EF5350';

function LevelLadder({ an, price, h = 236 }) {
  if (!an) return null;
  const W = 440, PAD = 12, plotW = 292;
  const { prof, supports, resistances } = an;
  const lo = Math.min(prof.lo, price), hi = Math.max(prof.hi, price);
  const span = (hi - lo) || price * 0.01;
  const y = p => PAD + ((hi - p) / span) * (h - PAD * 2);
  const maxQv = Math.max(...prof.bins.map(b => b.qv)) || 1;
  const barMax = plotW * 0.52;
  const rows = prof.bins.map(b => ({ ...b, yy: y(b.hi), hh: Math.max(1, y(b.lo) - y(b.hi) - 0.6) }));
  // 右侧标签防重叠：先占位现价，其余标签需要时上下微调
  const taken = [];
  const marks = [];
  const addMark = (p, text, color, dash = '3 3', bold = false) => {
    const y0 = y(p);
    if (!isFinite(y0) || y0 < PAD + 4 || y0 > h - PAD) return;
    let yText = y0;
    if (!bold) {
      for (let k = 1; k < 8; k++) {
        const cand = y0 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 10;
        if (cand > PAD + 4 && cand < h - PAD && !taken.some(t => Math.abs(t - cand) < 9)) { yText = cand; break; }
      }
    }
    if (taken.some(t => Math.abs(t - yText) < 8) && !bold) return;
    taken.push(yText);
    marks.push({ lineY: y0, y: yText, text, color, dash, bold });
  };
  addMark(price, `现价 ${LV.fmtNum(price)}`, '#FFFFFF', '', true);
  addMark(an.prof.poc.mid, `POC ${LV.fmtNum(an.prof.poc.mid)}`, '#F0B90B', '5 3');
  [...supports].slice(0, 2).forEach(l => addMark(l.price, `支撑 ${LV.fmtNum(l.price)} · ${l.strength}`, SUP_COL));
  [...resistances].slice(0, 2).forEach(l => addMark(l.price, `阻力 ${LV.fmtNum(l.price)} · ${l.strength}`, RES_COL));
  return (
    <svg viewBox={`0 0 ${W} ${h}`} className="w-full block" style={{ height: h }}>
      <rect x="0" y={y(prof.vaHi)} width={plotW} height={Math.max(1, y(prof.vaLo) - y(prof.vaHi))} fill="#F0B90B" opacity="0.06" />
      {rows.map(b => {
        const bw = barMax * (b.qv / maxQv);
        const buyW = bw * (b.qv ? b.buy / b.qv : 0.5);
        return (
          <g key={b.i}>
            <rect x="0" y={b.yy} width={Math.max(0.6, bw)} height={b.hh} fill={SELL_COL} opacity="0.42" />
            <rect x="0" y={b.yy} width={Math.max(0.6, buyW)} height={b.hh} fill={BUY_COL} opacity="0.62" />
          </g>
        );
      })}
      {marks.map((m, i) => (
        <g key={i}>
          <line x1="0" x2={plotW} y1={m.lineY} y2={m.lineY} stroke={m.color} strokeWidth={m.bold ? 1.3 : 1} strokeDasharray={m.dash} opacity={m.bold ? 0.95 : 0.8} />
          {Math.abs(m.y - m.lineY) > 1 && <line x1={plotW - 6} x2={plotW} y1={m.lineY} y2={m.y} stroke={m.color} strokeWidth="0.6" opacity="0.5" />}
          <text x={plotW + 6} y={m.y + 3} fill={m.color} fontSize="9.5" fontWeight={m.bold ? 700 : 500}>{m.text}</text>
        </g>
      ))}
      <line x1={plotW} x2={plotW} y1={PAD} y2={h - PAD} stroke="#2B3139" />
    </svg>
  );
}

/* ============================================================
 * 宏观面板
 * ============================================================ */
function MacroStrip({ compact, up, down }) {
  const items = MACRO.map(m => ({ ...m, imp: macroImpact(m) }));
  const cnt = t => items.filter(i => i.imp.tag === t).length;
  const bull = cnt('利多'), bear = cnt('利空');
  const bias = bull > bear ? '偏利多' : bear > bull ? '偏利空' : '中性';
  const col = t => t === '利多' ? up : t === '利空' ? down : '#848E9C';
  return (
    <div className={`${compact ? 'sticky bottom-0' : 'mt-4'} border-t border-border bg-panel/95 backdrop-blur`}>
      <div className={compact ? 'px-3 py-2' : 'max-w-[1600px] mx-auto px-4 py-3'}>
        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
          <span className="text-[11px] font-semibold text-white/90">宏观日历 · 对加密影响 <span className="tip text-muted cursor-help">ⓘ<span className="tipbox">{RULES_TEXT}</span></span></span>
          <span className="text-[11px]">综合：<span style={{ color: col(bias.includes('多') ? '利多' : bias.includes('空') ? '利空' : '') }} className="font-semibold">{bias}</span> <span className="text-muted">（利多 {bull} · 利空 {bear} · 中性 {cnt('中性')}）</span> <span className="text-muted">数据截至 {MACRO_AS_OF}</span></span>
        </div>
        <div className={`grid gap-2 ${compact ? 'grid-cols-2' : 'grid-cols-2 md:grid-cols-3 xl:grid-cols-6'}`}>
          {items.map(m => (
            <div key={m.key} className="bg-bg border border-border rounded-lg px-2.5 py-2 text-[10px]">
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-semibold">{m.key}</span>
                <span className="tip"><span className="px-1.5 rounded font-semibold cursor-help" style={{ color: col(m.imp.tag), border:`1px solid ${col(m.imp.tag)}66` }}>{m.imp.tag}{m.imp.tag === '利多' ? '(偏涨)' : m.imp.tag === '利空' ? '(偏跌)' : ''}</span><span className="tipbox">{m.imp.why}<br /><span className="text-muted">{RULES_TEXT}</span></span></span>
              </div>
              <div className="text-muted truncate" title={m.name}>{m.name} · {m.period}</div>
              <div className="grid grid-cols-3 gap-1 font-mono mt-1">
                <div><div className="text-muted">前值</div><div className="truncate" title={m.prev}>{m.prev}</div></div>
                <div><div className="text-muted">预期</div><div>{m.forecast}</div></div>
                <div><div className="text-muted">公布</div><div className="text-white font-semibold truncate" title={m.actual}>{m.actual}</div></div>
              </div>
              {!compact && m.note && <div className="text-muted mt-1 truncate" title={m.note}>{m.note}</div>}
              <div className="mt-1 text-muted">下次：<span className="text-white/80">{m.next.date}</span>{m.next.forecast !== '—' && <> · 预期 {m.next.forecast}</>}</div>
              {!compact && <div className="mt-1 flex gap-2">{m.src.map(([n, u]) => <a key={u} href={u} target="_blank" rel="noreferrer" className="text-sky-400 hover:underline">{n}</a>)}</div>}
            </div>))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
 * App
 * ============================================================ */
function App() {
  const [platform, setPlatform] = useState(() => {
    const q = new URLSearchParams(location.search).get('plat');
    if (q && PLATFORMS[q]) return q;
    return localStorage.getItem('cp_plat') || 'binance';
  });
  const P = PLATFORMS[platform];
  const [colorMode, setColorMode] = useState(() => localStorage.getItem('cp_color_v2') || 'rg');
  const up = colorMode === 'gr' ? '#0ECB81' : '#F6465D', down = colorMode === 'gr' ? '#F6465D' : '#0ECB81';
  const [search, setSearch] = useState('');
  // 支持 #/BTCUSDT 这类深链直接打开详情
  const [sel, setSel] = useState(() => {
    const h = (location.hash || '').replace(/^#\/?/, '').trim();
    return /^[A-Za-z0-9._-]{2,30}$/.test(h) ? h : null;
  });
  const [sortKey, setSortKey] = useState('chg');
  const [ws, setWs] = useState({});
  const [lastUpdate, setLastUpdate] = useState(null);
  const [err, setErr] = useState(null);
  const [ver, setVer] = useState(0);
  const [epoch, setEpoch] = useState(0); // 刷新计数
  const store = useRef({ tickers:new Map(), spot:{}, marks:{}, liq:{}, spark:{} });
  const [opts, setOpts] = useState({ N:2, K:3, universe:80, every:3, short:false });
  const [scan, setScan] = useState({ results:[], running:false, done:0, total:0, last:null, errors:0 });
  const [newSet, setNewSet] = useState(new Set());
  const [notifyOn, setNotifyOn] = useState(() => 'Notification' in window && Notification.permission === 'granted');
  const prevSigs = useRef(null);

  useEffect(() => localStorage.setItem('cp_plat', platform), [platform]);
  useEffect(() => localStorage.setItem('cp_color_v2', colorMode), [colorMode]);
  useEffect(() => {
    const want = sel ? `#/${sel}` : '';
    if (location.hash !== want) history.replaceState(null, '', location.pathname + location.search + want);
  }, [sel]);
  const touch = () => setLastUpdate(Date.now());

  // ---------- 行情：REST 初始化 + 轮询兜底 + WS ----------
  useEffect(() => {
    const st = store.current = { tickers:new Map(), spot:{}, marks:{}, liq:{}, spark:{} };
    setWs({}); setErr(null); setScan(s => ({ ...s, results:[], last:null })); prevSigs.current = null;
    let alive = true; const conns = [];
    const status = (n, v) => alive && setWs(w => ({ ...w, [n]: v }));
    const restAll = async (full) => {
      try {
        const [t, sp, mk] = await Promise.all([P.tickers(), P.spot(), full ? P.marks() : Promise.resolve(null)]);
        if (!alive) return;
        t.forEach(x => st.tickers.set(x.id, { ...st.tickers.get(x.id), ...x }));
        st.spot = { ...st.spot, ...sp }; if (mk) st.marks = { ...st.marks, ...mk };
        setErr(null); touch(); setVer(v => v + 1);
      } catch (e) { alive && setErr(`行情接口请求失败：${e.message}（若用 file:// 打开，请改用 python3 -m http.server）`); }
    };
    restAll(true);
    const anyWsDown = () => conns.some(c => !c.ws || c.ws.readyState !== 1);
    const poll = setInterval(() => { if (anyWsDown()) restAll(false); }, 5000);
    const pollFull = setInterval(() => restAll(true), 30000);

    const addLiq = (id, side, usd) => { const l = st.liq[id] || (st.liq[id] = { long:0, short:0, n:0 }); l[side] += usd; l.n++; };
    if (platform === 'binance') {
      conns.push(new WSConn('Binance 合约', 'wss://fstream.binance.com/stream?streams=!ticker@arr/!markPrice@arr@1s/!forceOrder@arr', { onStatus:status,
        onMessage: ({ stream, data }) => {
          if (stream === '!ticker@arr') data.forEach(x => { if (!x.s.endsWith('USDT')) return; const o = st.tickers.get(x.s) || { id:x.s }; o.last = +x.c; o.chg = +x.P; o.qv = +x.q; st.tickers.set(x.s, o); });
          else if (stream === '!markPrice@arr@1s') data.forEach(x => { st.marks[x.s] = { mark:+x.p, index:+x.i, funding:+x.r, nextFundingTime:+x.T }; });
          else if (stream === '!forceOrder@arr') { const o = data.o; addLiq(o.s, o.S === 'SELL' ? 'long' : 'short', +o.q * +o.ap); }
          touch();
        } }));
      conns.push(new WSConn('Binance 现货', 'wss://stream.binance.com:9443/stream?streams=btcusdt@ticker/ethusdt@ticker', { onStatus:status,
        onMessage: ({ data }) => { st.spot[data.s.replace('USDT','')] = { last:+data.c, chg:+data.P }; touch(); } }));
    } else {
      OKX.ctVal().catch(() => {});
      conns.push(new WSConn('OKX 公共', 'wss://ws.okx.com:8443/ws/v5/public', { onStatus:status, pingMs:25000,
        onOpen: w => {
          const top = [...st.tickers.values()].sort((a, b) => b.chg - a.chg).slice(0, 40).map(x => ({ channel:'tickers', instId:x.id }));
          w.send(JSON.stringify({ op:'subscribe', args:[
            { channel:'tickers', instId:'BTC-USDT' }, { channel:'tickers', instId:'ETH-USDT' },
            { channel:'tickers', instId:'BTC-USDT-SWAP' }, { channel:'tickers', instId:'ETH-USDT-SWAP' },
            { channel:'mark-price', instId:'BTC-USDT-SWAP' }, { channel:'mark-price', instId:'ETH-USDT-SWAP' },
            { channel:'liquidation-orders', instType:'SWAP' }, ...top ] }));
        },
        onMessage: msg => {
          if (!msg.arg || !msg.data) return;
          const ch = msg.arg.channel;
          if (ch === 'tickers') msg.data.forEach(x => {
            const chg = (+x.last / +x.open24h - 1) * 100;
            if (x.instId.endsWith('-SWAP')) { const o = st.tickers.get(x.instId) || { id:x.instId }; o.last = +x.last; o.chg = chg; o.qv = +x.volCcy24h * +x.last; st.tickers.set(x.instId, o); }
            else st.spot[x.instId.split('-')[0]] = { last:+x.last, chg };
          });
          else if (ch === 'mark-price') msg.data.forEach(x => { st.marks[x.instId] = { ...st.marks[x.instId], mark:+x.markPx }; });
          else if (ch === 'liquidation-orders') msg.data.forEach(x => { const cv = (OKX_CTVAL || {})[x.instId] || 0; (x.details || []).forEach(dd => cv && addLiq(x.instId, dd.posSide === 'long' ? 'long' : 'short', +dd.sz * cv * +dd.bkPx)); });
          touch();
        } }));
    }
    const rr = setInterval(() => setVer(v => v + 1), 1000); // 1s 节流渲染
    return () => { alive = false; conns.forEach(c => c.close()); clearInterval(poll); clearInterval(pollFull); clearInterval(rr); };
  }, [platform, epoch]);

  const st = store.current;
  const top20 = useMemo(() => [...st.tickers.values()].filter(x => x.qv > 0).sort((a, b) => b.chg - a.chg).slice(0, 20).map((x, i) => ({ ...x, rank:i + 1 })), [ver]);
  const top20Key = top20.map(x => x.id).join(',');

  // ---------- Top20 1h K 线（走势 + 1h%）----------
  useEffect(() => {
    let alive = true;
    const load = () => top20.forEach(async x => {
      try { const k = await P.klines(x.id, '1h', 49); if (!alive) return;
        st.spark[x.id] = { spark: k.filter(c => c.closed).slice(-24).map(c => c.c), h1: S.liveReturn(k) }; setVer(v => v + 1); } catch {}
    });
    load(); const iv = setInterval(load, 60000);
    return () => { alive = false; clearInterval(iv); };
  }, [top20Key, platform]);

  const rows = useMemo(() => {
    const q = search.trim().toUpperCase();
    let r = top20.map(x => ({ ...x, ...st.spark[x.id] }));
    if (q) r = r.filter(x => P.disp(x.id).includes(q));
    const k = sortKey.replace('-', ''), asc = sortKey.startsWith('-');
    return r.sort((a, b) => { const x = a[k] ?? -1e9, y = b[k] ?? -1e9; return asc ? x - y : y - x; });
  }, [ver, search, sortKey]);

  // ---------- 顺大逆小 扫描 ----------
  const runScan = useCallback(async () => {
    const st = store.current;
    const uni = [...st.tickers.values()].sort((a, b) => b.qv - a.qv).slice(0, opts.universe);
    if (!uni.length) return;
    setScan(s => ({ ...s, running:true, done:0, total:uni.length, errors:0 }));
    const out = []; let done = 0, errors = 0;
    await Promise.all(uni.map(async x => {
      try {
        const [m15, h1, h4, d1] = await Promise.all(['15m','1h','4h','1d'].map(tf => P.klines(x.id, tf, 60)));
        const k = { m15, h1, h4, d1 };
        for (const side of opts.short ? ['long','short'] : ['long']) {
          const e = S.evaluate(k, { N:opts.N, K:opts.K, side });
          if (e.match) out.push({ id:x.id, side, price:st.tickers.get(x.id)?.last ?? e.price, d1:e.d1.ret, h4:e.h4.ret, h1:e.h1.ret, streak:e.streak15.n, pull:e.pullback, rsi15:e.rsi15, score:e.score, funding:st.marks[x.id]?.funding });
        }
      } catch { errors++; }
      done++; if (done % 5 === 0) setScan(s => ({ ...s, done }));
    }));
    // OKX 无批量资金费率：仅对命中币种补拉
    if (P.id === 'okx') await Promise.all(out.map(async r => { try { r.funding = (await P.funding(r.id)).predicted; } catch {} }));
    out.sort((a, b) => b.score - a.score);
    const keys = new Set(out.map(r => r.side + r.id));
    if (prevSigs.current) {
      const fresh = [...keys].filter(k => !prevSigs.current.has(k));
      if (fresh.length) {
        setNewSet(new Set(fresh)); setTimeout(() => setNewSet(new Set()), 60000);
        beep();
        if ('Notification' in window && Notification.permission === 'granted')
          new Notification('顺大逆小 新信号', { body: fresh.map(k => (k.startsWith('long') ? '多 ' : '空 ') + P.disp(k.replace(/^(long|short)/, ''))).join('、') + '（仅供参考）' });
      }
    }
    prevSigs.current = keys;
    setScan({ results:out, running:false, done, total:uni.length, last:Date.now(), errors });
  }, [P, opts]);
  const scanRef = useRef(runScan); scanRef.current = runScan;
  const ready = st.tickers.size > 0;
  useEffect(() => {
    if (!ready) return;
    scanRef.current();
    const iv = setInterval(() => scanRef.current(), opts.every * 60000);
    return () => clearInterval(iv);
  }, [ready, platform, epoch, opts.N, opts.K, opts.universe, opts.short]);

  const enableNotify = async () => {
    beep();
    if (!('Notification' in window)) return alert('此浏览器不支持系统通知，将仅使用声音 + 高亮提醒');
    const p = await Notification.requestPermission(); setNotifyOn(p === 'granted');
  };
  const onRefresh = () => { CACHE.clear(); setEpoch(e => e + 1); };

  const mk = b => st.marks[P.majorId(b)];
  return (
    <div className="min-h-full flex flex-col">
      <Header {...{ platform, setPlatform, ws, lastUpdate, onRefresh, search, setSearch, colorMode, setColorMode, err }} />
      <main className="flex-1 max-w-[1600px] w-full mx-auto px-4 py-4 space-y-4">
        <div className="flex flex-col lg:flex-row gap-3">
          {['BTC','ETH'].map(b => <MajorCard key={b} base={b} spot={st.spot[b]} fut={st.tickers.get(P.majorId(b))} mark={mk(b)} up={up} down={down} />)}
          <div className="bg-panel border border-border rounded-xl p-4 lg:w-[340px] text-xs">
            <div className="flex justify-between mb-2"><span className="font-semibold">𝕏 情绪 · BTC / ETH</span><Snap t={SNAP.snapshotTime} /></div>
            {['BTC','ETH'].map(b => { const s = SNAP.sentiment[b]; return s && <div key={b} className="mb-2 cursor-pointer" onClick={() => setSel(P.majorId(b))}>
              <div><span className="font-semibold">{b}</span> <span style={{ color: s.score >= 0 ? up : down }}>{s.score > 0 ? '+' : ''}{s.score}</span> <span className="text-muted">多{Math.round(s.bull * 100)}% / 空{Math.round(s.bear * 100)}%</span></div>
              <div className="text-white/75 text-[11px] leading-snug">{s.headline}</div></div>; })}
          </div>
        </div>
        <SignalBoard {...{ P, scan, opts, setOpts, onSelect:setSel, up, down, newSet, notifyOn, enableNotify, runNow:() => runScan() }} />
        <GainersTable rows={rows} P={P} sel={sel} onSelect={setSel} up={up} down={down} sortKey={sortKey} setSortKey={setSortKey} />
        <div className="text-[10px] text-muted">数据源：<Live /> {P.label} 公开行情接口（REST / WebSocket，无需密钥）· <Snap t="" /> 𝕏 情绪 / 快讯 {SNAP.snapshotTime} · 宏观数据人工核实截至 {MACRO_AS_OF} · <Demo /> 未接入的数据。仅供参考，不构成投资建议。</div>
      </main>
      <MacroStrip up={up} down={down} />
      {sel && <Drawer id={sel} P={P} tick={st.tickers.get(sel)} liqAgg={st.liq} onClose={() => setSel(null)} up={up} down={down} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
